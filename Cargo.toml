[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "pdfkit"
version = "27.0.0"
edition = "2021"
authors = ["arlomu"]
description = "Native PDF document model and TontooUI viewer for TontooOS"
license = "TCL"
repository = "https://github.com/TontooOS/PDFKit"
keywords = ["tontoo", "pdf", "viewer", "vello"]
categories = ["gui", "parser-implementations"]

[dependencies]
parley = "0.11"
archivekit = { package = "archivekit", path = "../ArchiveKit" }
foundation = { package = "foundation", path = "../Foundation" }
coreimage = { package = "coreimage", path = "../CoreImage" }
md5 = "0.7"
sha2 = "0.10"
aes = "0.8"
tontooui = { package = "tontooui", path = "../TontooUI" }
vello = "0.10"
